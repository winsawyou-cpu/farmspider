<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>마블 팜: 오디오 에디션</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Black+Han+Sans&display=swap');

        body {
            font-family: 'Black Han Sans', sans-serif;
            background-color: #0f172a;
            touch-action: none;
            user-select: none;
            overflow: hidden;
        }

        .comic-font { font-family: 'Bangers', cursive; letter-spacing: 1.5px; }

        /* --- 마블 스타일 버튼 커스텀 --- */
        .marvel-btn {
            transform: skew(-10deg);
            border: 4px solid black;
            box-shadow: 5px 5px 0px black;
            transition: all 0.1s;
        }
        .marvel-btn:active {
            transform: skew(-10deg) translate(3px, 3px);
            box-shadow: 2px 2px 0px black;
        }
        .marvel-btn-text {
            transform: skew(10deg);
        }

        /* --- 게임 보드 --- */
        #game-area {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1/1;
            margin-top: 10px;
        }

        #game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            height: 100%;
        }

        .tile {
            background: #451a03;
            border-radius: 12px;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            border: 3px solid #78350f;
            cursor: pointer;
            overflow: hidden;
        }

        /* --- 히어로 디자인 --- */
        #hero-container {
            position: absolute;
            width: 70px; height: 70px;
            pointer-events: none;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 50;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
        }

        .spidey-head {
            width: 100%; height: 100%;
            background: #ef4444;
            border-radius: 45% 45% 50% 50%;
            border: 3px solid #7f1d1d;
            position: relative;
            overflow: hidden;
        }
        .spidey-eye {
            position: absolute; top: 25%; width: 35%; height: 40%;
            background: white; border: 4px solid black;
            border-radius: 0 100% 0 100%; 
        }
        .eye-l { left: 10%; transform: rotate(-15deg); }
        .eye-r { right: 10%; transform: scaleX(-1) rotate(-15deg); }

        .hulk-head {
            width: 100%; height: 100%;
            background: #65a30d;
            border-radius: 12px;
            border: 3px solid #365314;
            position: relative;
            overflow: hidden;
        }
        .hulk-hair {
            position: absolute; top: 0; width: 100%; height: 35%;
            background: #1a2e05;
            clip-path: polygon(0 0, 100% 0, 100% 80%, 90% 65%, 80% 90%, 70% 65%, 60% 85%, 50% 65%, 40% 85%, 30% 65%, 20% 85%, 10% 65%, 0 80%);
        }
        .hulk-brow {
            position: absolute; top: 42%; width: 30%; height: 6px;
            background: #1a2e05; border-radius: 2px;
        }
        .hb-l { left: 12%; transform: rotate(8deg); }
        .hb-r { right: 12%; transform: rotate(-8deg); }
        .hulk-eye {
            position: absolute; top: 50%; width: 18%; height: 10px;
            background: white; border: 1.5px solid black; border-radius: 2px;
        }
        .he-l { left: 18%; }
        .he-r { right: 18%; }
        .hulk-mouth {
            position: absolute; bottom: 18%; left: 30%; width: 40%; height: 6px;
            background: #365314; border-radius: 10px;
        }

        /* --- 시각 효과 --- */
        .spider-sense {
            position: absolute; top: -25px; left: 50%; transform: translateX(-50%);
            font-size: 24px; color: #facc15; font-weight: bold;
            animation: wiggle 0.2s infinite; z-index: 60; text-shadow: 0 0 5px red;
        }
        @keyframes wiggle { 0%, 100% { transform: translate(-50%) rotate(-10deg); } 50% { transform: translate(-50%) rotate(10deg); } }

        .bomb-pulse { animation: pulse-red 0.8s infinite; border-color: red !important; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); } 100% { box-shadow: 0 0 0 15px rgba(255, 0, 0, 0); } }

        .web-shot {
            position: absolute; height: 4px; background: white;
            transform-origin: 0 50%; z-index: 40; pointer-events: none;
            box-shadow: 0 0 5px rgba(255,255,255,0.8);
        }

        .progress-bar { transition: width 1s linear; }
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 200;
        }
        .hidden { display: none !important; }

    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center text-white overflow-hidden bg-gray-900">

    <!-- HUD -->
    <div class="w-full max-w-md p-4 absolute top-0 z-20">
        <div class="flex justify-between items-end mb-1">
            <div class="text-yellow-400 comic-font text-xl">LEVEL <span id="level-display">1</span>/10</div>
            <div class="text-gray-300 text-sm">TARGET: $<span id="target-score">100</span></div>
            <div class="text-red-400 font-bold text-xl">⏱️ <span id="time-display">60</span>s</div>
        </div>
        
        <div class="w-full h-3 bg-gray-700 rounded-full overflow-hidden mb-3 border border-gray-600">
            <div id="time-bar" class="h-full bg-green-500 progress-bar" style="width: 100%;"></div>
        </div>

        <div class="flex justify-between items-center bg-gray-800 p-3 rounded-xl border-2 border-black shadow-[4px_4px_0px_black]">
            <div>
                <div class="text-xs text-gray-400">EARNINGS</div>
                <div class="text-2xl comic-font text-green-400">$<span id="score">0</span></div>
            </div>
            <div class="text-right">
                <div class="text-xs text-gray-400">ULTIMATE</div>
                <div class="text-xl comic-font text-blue-400" id="ult-gauge-text">0%</div>
            </div>
        </div>
    </div>

    <!-- 게임 영역 -->
    <div id="game-area">
        <div id="hero-container">
            <div id="skin-spidey" class="spidey-head">
                <div class="spidey-eye eye-l"></div>
                <div class="spidey-eye eye-r"></div>
                <div id="sense-icon" class="spider-sense hidden">⚡⚡⚡</div>
            </div>
            <div id="skin-hulk" class="hulk-head hidden">
                <div class="hulk-hair"></div>
                <div class="hulk-brow hb-l"></div>
                <div class="hulk-brow hb-r"></div>
                <div class="hulk-eye he-l"></div>
                <div class="hulk-eye he-r"></div>
                <div class="hulk-mouth"></div>
            </div>
        </div>

        <div id="game-grid"></div>

        <button id="btn-ultimate" onclick="useUltimate()" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-24 h-24 rounded-full flex items-center justify-center hidden z-[100] shadow-[0_0_30px_rgba(255,255,255,0.8)] transition hover:scale-110 active:scale-90 bg-gradient-to-tr from-yellow-400 to-red-500 border-4 border-black animate-pulse">
            <div class="text-4xl">⚡</div>
        </button>
    </div>

    <!-- 하단 컨트롤 -->
    <div class="w-full max-w-md p-6 bg-transparent z-20 absolute bottom-0">
        <div class="flex gap-4">
            <button onclick="changeHero('spidey')" id="btn-spidey" class="flex-1 p-3 marvel-btn bg-red-600 border-black ring-4 ring-red-400 ring-opacity-0 transition-all">
                <div class="marvel-btn-text">
                    <div class="text-2xl mb-1">🕷️</div>
                    <div class="text-sm font-bold text-white comic-font">SPIDEY</div>
                </div>
            </button>
            <button onclick="changeHero('hulk')" id="btn-hulk" class="flex-1 p-3 marvel-btn bg-green-600 border-black opacity-50 transition-all">
                <div class="marvel-btn-text">
                    <div class="text-2xl mb-1">🧟‍♂️</div>
                    <div class="text-sm font-bold text-white comic-font">HULK</div>
                </div>
            </button>
        </div>
    </div>

    <!-- 모달 -->
    <div id="modal" class="modal-overlay">
        <div class="bg-gray-800 p-8 rounded-2xl border-4 border-black shadow-[8px_8px_0px_#facc15] text-center max-w-xs">
            <h1 id="modal-title" class="text-4xl comic-font text-yellow-400 mb-2">MISSION START</h1>
            <p id="modal-desc" class="text-gray-300 mb-6 text-sm">목표 금액을 달성하세요!</p>
            <div class="space-y-2 mb-6 text-left bg-gray-900 p-4 rounded-lg border-2 border-black text-sm">
                <div class="flex justify-between"><span>🎯 목표:</span> <span id="modal-target" class="text-green-400 font-bold">$100</span></div>
                <div class="flex justify-between"><span>⏳ 시간:</span> <span id="modal-time" class="text-red-400 font-bold">60초</span></div>
            </div>
            <button id="modal-btn" onclick="startLevel()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-lg border-4 border-black shadow-[4px_4px_0px_black] text-2xl comic-font transition transform active:scale-95">
                START GAME
            </button>
        </div>
    </div>

    <script>
        // --- 사운드 매니저 (Web Audio API) ---
        const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSFX(type) {
            const osc = AudioCtx.createOscillator();
            const gain = AudioCtx.createGain();
            osc.connect(gain);
            gain.connect(AudioCtx.destination);

            const now = AudioCtx.currentTime;

            switch(type) {
                case 'harvest': // Thwip 소리
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.1);
                    osc.start();
                    osc.stop(now + 0.1);
                    break;
                case 'defuse': // 띵 소리
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1000, now);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start();
                    osc.stop(now + 0.3);
                    break;
                case 'explode': // 콰광 소리
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(40, now + 0.5);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.5);
                    osc.start();
                    osc.stop(now + 0.5);
                    break;
                case 'ultimate': // 필살기 레이저
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(100, now);
                    osc.frequency.exponentialRampToValueAtTime(2000, now + 0.8);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.8);
                    osc.start();
                    osc.stop(now + 0.8);
                    break;
                case 'popup': // 팝업 알림
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(660, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start();
                    osc.stop(now + 0.4);
                    break;
                case 'smash': // 헐크 스매시
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.2);
                    osc.start();
                    osc.stop(now + 0.2);
                    break;
            }
        }

        function triggerVibrate(ms) {
            if (navigator.vibrate) navigator.vibrate(ms);
        }

        // --- 레벨 설정 ---
        const LEVELS = [
            { id: 1, target: 100, time: 60, bombRate: 0.0, title: "기본 훈련", desc: "농작물을 심고 수확하는 연습을 하세요." },
            { id: 2, target: 200, time: 60, bombRate: 0.0, title: "기초 다지기", desc: "조금 더 빠르게 작물을 키워봅시다." },
            { id: 3, target: 300, time: 55, bombRate: 0.02, title: "첫 번째 고난", desc: "낮은 확률로 폭탄이 나타날 수 있습니다!" },
            { id: 4, target: 450, time: 55, bombRate: 0.04, title: "고블린의 방해", desc: "폭탄 제거에 더 집중해야 합니다." },
            { id: 5, target: 600, time: 50, bombRate: 0.06, title: "히어로의 일상", desc: "헐크와 스파이디의 완벽한 호흡이 필요해요." },
            { id: 6, target: 800, time: 50, bombRate: 0.08, title: "숙련된 농부", desc: "작물 성장 속도가 점점 빨라집니다." },
            { id: 7, target: 1000, time: 45, bombRate: 0.1, title: "감마 에너지 폭주", desc: "헐크의 스매시가 더 중요해집니다!" },
            { id: 8, target: 1250, time: 45, bombRate: 0.12, title: "뉴욕의 수호자", desc: "폭탄이 쏟아집니다. 침착하게 대응하세요." },
            { id: 9, target: 1500, time: 40, bombRate: 0.15, title: "최후의 시험", desc: "최고의 집중력이 필요한 단계입니다." },
            { id: 10, target: 2000, time: 40, bombRate: 0.18, title: "어벤져스 어셈블!", desc: "전설적인 히어로 농부가 되어보세요!" }
        ];

        const STATE = {
            levelIdx: 0, money: 0, timeLeft: 0, gauge: 0,
            hero: 'spidey', tiles: [], crops: ['🌽', '🍅', '🍆', '🍇'],
            gameInterval: null, timerInterval: null, isPlaying: false
        };

        const ELS = {
            grid: document.getElementById('game-grid'),
            hero: document.getElementById('hero-container'),
            score: document.getElementById('score'),
            ultText: document.getElementById('ult-gauge-text'),
            ultBtn: document.getElementById('btn-ultimate'),
            timeDisplay: document.getElementById('time-display'),
            timeBar: document.getElementById('time-bar'),
            levelDisplay: document.getElementById('level-display'),
            targetScore: document.getElementById('target-score'),
            modal: document.getElementById('modal'),
            modalBtn: document.getElementById('modal-btn'),
            sense: document.getElementById('sense-icon')
        };

        function init() {
            createGrid();
            showLevelModal();
            changeHero('spidey');
        }

        function showLevelModal() {
            playSFX('popup');
            const lv = LEVELS[STATE.levelIdx];
            document.getElementById('modal-title').innerText = lv.title;
            document.getElementById('modal-desc').innerText = lv.desc;
            document.getElementById('modal-target').innerText = `$${lv.target}`;
            document.getElementById('modal-time').innerText = `${lv.time}초`;
            ELS.modalBtn.innerText = "START GAME";
            ELS.modalBtn.onclick = startLevel;
            ELS.modal.classList.remove('hidden');
        }

        function startLevel() {
            if (AudioCtx.state === 'suspended') AudioCtx.resume();
            ELS.modal.classList.add('hidden');
            const lv = LEVELS[STATE.levelIdx];
            STATE.money = 0; STATE.timeLeft = lv.time; STATE.gauge = 0; STATE.isPlaying = true;
            ELS.levelDisplay.innerText = lv.id; ELS.targetScore.innerText = lv.target;
            updateUI(); STATE.tiles.forEach(t => resetTile(t));
            
            clearInterval(STATE.gameInterval); clearInterval(STATE.timerInterval);
            STATE.gameInterval = setInterval(gameLoop, 500);
            STATE.timerInterval = setInterval(() => {
                STATE.timeLeft--; updateTimerUI();
                if (STATE.timeLeft <= 0) endGame(false);
            }, 1000);
            setTimeout(() => moveHeroToTile(0), 100);
        }

        function endGame(isClear) {
            STATE.isPlaying = false;
            clearInterval(STATE.gameInterval); clearInterval(STATE.timerInterval);
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');
            const btn = ELS.modalBtn;
            
            if (isClear) {
                playSFX('popup');
                title.innerText = "MISSION CLEAR!";
                title.className = "text-4xl comic-font mb-2 text-green-400";
                desc.innerText = `목표 달성! $${STATE.money}`;
                
                if (STATE.levelIdx < LEVELS.length - 1) {
                    btn.innerText = "NEXT LEVEL";
                    btn.onclick = () => { STATE.levelIdx++; showLevelModal(); };
                } else {
                    desc.innerText = "모든 미션을 완료했습니다!";
                    btn.innerText = "RESTART ALL";
                    btn.onclick = () => { STATE.levelIdx = 0; showLevelModal(); };
                }
            } else {
                playSFX('explode');
                triggerVibrate(200);
                title.innerText = "GAME OVER";
                title.className = "text-4xl comic-font mb-2 text-red-500";
                desc.innerText = "시간 초과...";
                btn.innerText = "RETRY";
                btn.onclick = startLevel;
            }
            ELS.modal.classList.remove('hidden');
        }

        function updateTimerUI() {
            const lv = LEVELS[STATE.levelIdx];
            ELS.timeDisplay.innerText = STATE.timeLeft;
            const pct = (STATE.timeLeft / lv.time) * 100;
            ELS.timeBar.style.width = `${pct}%`;
            ELS.timeBar.className = pct < 20 ? "h-full bg-red-500 progress-bar animate-pulse" : "h-full bg-green-500 progress-bar";
        }

        function createGrid() {
            ELS.grid.innerHTML = ''; STATE.tiles = [];
            for (let i = 0; i < 16; i++) {
                const el = document.createElement('div');
                el.className = 'tile flex items-center justify-center text-3xl font-bold';
                el.onclick = () => handleInteraction(i);
                STATE.tiles.push({ el, state: 'empty', growth: 0, bomb: false, idx: i });
                ELS.grid.appendChild(el);
            }
        }

        function handleInteraction(idx) {
            if (!STATE.isPlaying) return;
            moveHeroToTile(idx);
            const tile = STATE.tiles[idx];
            if (tile.bomb && STATE.hero !== 'spidey') {
                showFloatText(tile.el, "SPIDEY ONLY!", "red"); return;
            }
            if (STATE.hero === 'spidey') {
                if (tile.bomb) {
                    shootWeb(idx); tile.bomb = false; tile.el.classList.remove('bomb-pulse');
                    STATE.money += 50; 
                    playSFX('defuse');
                    triggerVibrate(50);
                    showFloatText(tile.el, "DEFUSED!", "#60a5fa");
                    ELS.sense.classList.add('hidden');
                } else if (tile.state === 'ripe') {
                    shootWeb(idx); harvest(tile);
                }
            } else { // Hulk
                if (tile.state === 'burnt') {
                    playSFX('smash');
                    hulkSmashEffect(); tile.state = 'empty'; STATE.money += 10;
                    showFloatText(tile.el, "CLEAN!", "#4ade80");
                } else if (tile.state === 'planted') {
                    playSFX('smash');
                    hulkSmashEffect(); tile.growth = 100; tile.state = 'ripe';
                    STATE.money += 5; showFloatText(tile.el, "GROW!", "#a3e635");
                } else if (tile.state === 'empty') {
                    tile.state = 'planted'; tile.growth = 0;
                    tile.cropType = Math.floor(Math.random() * STATE.crops.length);
                    showFloatText(tile.el, "-$5", "#fca5a5");
                }
            }
            renderTile(tile); checkWin();
        }

        function checkWin() {
            const lv = LEVELS[STATE.levelIdx];
            if (STATE.money >= lv.target) endGame(true);
        }

        function gameLoop() {
            const lv = LEVELS[STATE.levelIdx];
            STATE.tiles.forEach(tile => {
                if (tile.state === 'planted' && tile.growth < 100) {
                    tile.growth += 5;
                    if (tile.growth >= 100) { tile.state = 'ripe'; tile.growth = 100; }
                    renderTile(tile);
                }
            });
            if (Math.random() < lv.bombRate) spawnBombAttempt();
        }

        function shootWeb(targetIdx) {
            playSFX('harvest');
            const hRect = ELS.hero.getBoundingClientRect();
            const tRect = STATE.tiles[targetIdx].el.getBoundingClientRect();
            const aRect = document.getElementById('game-area').getBoundingClientRect();
            const sX = (hRect.left + hRect.width/2) - aRect.left;
            const sY = (hRect.top + hRect.height/2) - aRect.top;
            const eX = (tRect.left + tRect.width/2) - aRect.left;
            const eY = (tRect.top + tRect.height/2) - aRect.top;
            const angle = Math.atan2(eY - sY, eX - sX) * (180/Math.PI);
            const len = Math.hypot(eX - sX, eY - sY);
            const web = document.createElement('div');
            web.className = 'web-shot'; web.style.width = len + 'px';
            web.style.left = sX + 'px'; web.style.top = sY + 'px';
            web.style.transform = `rotate(${angle}deg)`;
            document.getElementById('game-area').appendChild(web);
            setTimeout(() => web.remove(), 200);
        }

        function hulkSmashEffect() {
            document.body.style.transform = "translate(5px, 5px)";
            setTimeout(() => document.body.style.transform = "none", 100);
        }

        function spawnBombAttempt() {
            const avail = STATE.tiles.filter(t => !t.bomb && t.state !== 'burnt');
            if (!avail.length) return;
            ELS.sense.classList.remove('hidden');
            setTimeout(() => {
                if (!STATE.isPlaying) return;
                const target = avail[Math.floor(Math.random() * avail.length)];
                target.bomb = true; target.el.classList.add('bomb-pulse');
                renderTile(target);
                setTimeout(() => { if (target.bomb && STATE.isPlaying) explode(target); }, 3000);
            }, 1000);
        }

        function explode(tile) {
            tile.bomb = false; tile.state = 'burnt'; tile.growth = 0;
            tile.el.classList.remove('bomb-pulse');
            STATE.money = Math.max(0, STATE.money - 50);
            playSFX('explode');
            triggerVibrate(150);
            showFloatText(tile.el, "BOOM!", "red");
            ELS.sense.classList.add('hidden'); renderTile(tile); updateUI();
        }

        function harvest(tile) {
            STATE.money += 20; STATE.gauge = Math.min(100, STATE.gauge + 10);
            tile.state = 'empty'; tile.growth = 0;
            showFloatText(tile.el, "+$20", "#fcd34d"); updateUI();
        }

        function useUltimate() {
            if (STATE.gauge < 100) return;
            STATE.gauge = 0; ELS.ultBtn.classList.add('hidden'); updateUI();
            playSFX('ultimate');
            triggerVibrate(300);
            if (STATE.hero === 'spidey') {
                STATE.tiles.forEach((t, i) => {
                    if (t.bomb) { t.bomb=false; t.el.classList.remove('bomb-pulse'); }
                    if (t.state === 'ripe') { shootWeb(i); harvest(t); }
                    renderTile(t);
                });
            } else {
                hulkSmashEffect();
                STATE.tiles.forEach(t => {
                    if (t.state === 'burnt') t.state = 'empty';
                    if (t.state === 'planted') { t.state='ripe'; t.growth=100; }
                    renderTile(t);
                });
            }
            checkWin();
        }

        function renderTile(tile) {
            tile.el.innerHTML = '';
            if (tile.state === 'burnt') { tile.el.style.background = '#1f2937'; tile.el.innerText = '🔥'; }
            else { tile.el.style.background = '#451a03'; }
            if (tile.state === 'planted') {
                const s = 0.5 + (tile.growth/200);
                tile.el.innerHTML = `<div style="transform:scale(${s})">🌱</div>`;
                const bar = document.createElement('div');
                bar.className = 'absolute bottom-1 w-10/12 h-1 bg-gray-700 rounded';
                bar.innerHTML = `<div class="h-full bg-green-500" style="width:${tile.growth}%"></div>`;
                tile.el.appendChild(bar);
            } else if (tile.state === 'ripe') {
                tile.el.innerText = STATE.crops[tile.cropType||0];
                tile.el.style.background = '#713f12';
            }
            if (tile.bomb) {
                const b = document.createElement('div');
                b.innerText = '💣'; b.className = 'absolute z-10 animate-bounce text-2xl';
                tile.el.appendChild(b);
            }
        }

        function resetTile(tile) {
            tile.state = 'empty'; tile.growth = 0; tile.bomb = false;
            tile.el.classList.remove('bomb-pulse'); renderTile(tile);
        }

        function updateUI() {
            ELS.score.innerText = STATE.money;
            ELS.ultText.innerText = Math.floor(STATE.gauge) + "%";
            if (STATE.gauge >= 100) ELS.ultBtn.classList.remove('hidden');
            else ELS.ultBtn.classList.add('hidden');
        }

        function changeHero(hero) {
            STATE.hero = hero;
            document.getElementById('skin-spidey').classList.toggle('hidden', hero !== 'spidey');
            document.getElementById('skin-hulk').classList.toggle('hidden', hero !== 'hulk');
            const sBtn = document.getElementById('btn-spidey');
            const hBtn = document.getElementById('btn-hulk');
            if (hero === 'spidey') {
                sBtn.style.opacity = "1"; sBtn.style.boxShadow = "8px 8px 0px black";
                hBtn.style.opacity = "0.5"; hBtn.style.boxShadow = "2px 2px 0px black";
            } else {
                hBtn.style.opacity = "1"; hBtn.style.boxShadow = "8px 8px 0px black";
                sBtn.style.opacity = "0.5"; sBtn.style.boxShadow = "2px 2px 0px black";
            }
        }

        function moveHeroToTile(idx) {
            const tEl = STATE.tiles[idx].el;
            const aRect = document.getElementById('game-area').getBoundingClientRect();
            const tRect = tEl.getBoundingClientRect();
            const x = (tRect.left - aRect.left) + (tRect.width/2) - 35;
            const y = (tRect.top - aRect.top) + (tRect.height/2) - 35;
            ELS.hero.style.transform = `translate(${x}px, ${y}px)`;
        }

        function showFloatText(p, t, c) {
            const el = document.createElement('div');
            el.innerText = t; el.style.color = c;
            el.className = 'absolute z-50 text-xl font-bold comic-font pointer-events-none transition duration-700 ease-out';
            el.style.top = '50%'; el.style.left = '50%';
            el.style.transform = 'translate(-50%,-50%)';
            p.appendChild(el);
            requestAnimationFrame(() => { el.style.transform = 'translate(-50%,-150%) scale(1.2)'; el.style.opacity = '0'; });
            setTimeout(() => el.remove(), 700);
        }

        window.onload = init;
    </script>
</body>
</html>
